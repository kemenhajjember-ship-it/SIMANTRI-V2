<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMANTRI — Layar Ruang Tunggu</title>

<!-- LIBRARY SUARA PREMIUM -->
<script src="https://code.responsivevoice.org/responsivevoice.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bronze: '#2b1b10',
          'bronze-raised': '#3d2817',
          gold: '#e8c547',
          'gold-deep': '#d4af37',
          cream: '#f5eee0',
          border: '#6b4e2a',
        },
        fontFamily: {
          sans: ['Manrope', 'sans-serif'],
          mono: ['"Courier New"', 'monospace'],
        },
      },
    },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<!-- ICON -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
  :root {
    --glow-gold: rgba(232, 197, 71, 0.55);
    --bg-active: linear-gradient(145deg, #4a3320 0%, #2b1b10 100%);
    --bg-selesai: linear-gradient(145deg, #1b2e1b 0%, #111a11 100%);
  }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{ font-variant-numeric: tabular-nums; }

  /* Animasi Kilat untuk Panggilan Aktif */
  @keyframes card-pulse{
    0%,100%{ border-color:#e8c547; box-shadow:0 0 0 1px #d4af37, 0 0 34px -8px rgba(232,197,71,0.45); }
    50%{ border-color:#f5eee0; box-shadow:0 0 0 3px #e8c547, 0 0 60px 0px rgba(232,197,71,0.7); }
  }
  .card-active { animation: card-pulse 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; z-index: 10; background: var(--bg-active); }
  
  /* Efek Kotak Loket Selesai */
  .card-selesai { transition: all 0.5s ease; transform: scale(0.96); background: var(--bg-selesai) !important; border-color: #22c55e !important; opacity: 0.95; }
  
  @keyframes pop-bounce { 0% { transform: scale(0.5) translateY(20px); opacity: 0; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .animate-pop { animation: pop-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

  /* Ticker */
  @keyframes ticker-scroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .ticker-track{ display:flex; width:max-content; white-space:nowrap; animation: ticker-scroll 32s linear infinite; }
</style>
</head>
<body class="flex h-screen w-full flex-col overflow-hidden bg-bronze font-sans text-cream">

  <!-- OVERLAY AKTIVASI -->
  <div id="overlayAktifkan" class="fixed inset-0 z-[100] flex flex-col items-center justify-center gap-6 bg-black/95">
    <p class="font-sans text-3xl font-extrabold uppercase tracking-[0.1em] text-gold">SIMANTRI — Layar Ruang Tunggu</p>
    <button id="btnAktifkan" type="button" class="animate-bounce rounded-full bg-gold px-12 py-5 text-xl font-extrabold text-bronze shadow-[0_0_40px_rgba(232,197,71,0.4)] transition-transform active:scale-95 hover:scale-105 hover:bg-gold-deep">
      🔊 Klik Untuk Mengaktifkan Layar &amp; Suara
    </button>
  </div>

  <!-- HEADER FULL WIDTH -->
  <header class="shrink-0 flex items-center justify-between gap-3 border-b-2 border-gold/30 bg-black/20 px-6 py-3 lg:py-4 shadow-md md:px-8">
    <div class="flex items-center gap-3 lg:gap-4 min-w-0">
      <img src="logo.png" alt="Logo" class="h-10 w-10 lg:h-14 lg:w-14 rounded-full border-2 border-gold object-cover shadow-md shrink-0">
      <div class="text-left min-w-0">
        <h1 class="font-sans text-lg md:text-xl lg:text-3xl font-extrabold uppercase leading-none tracking-widest text-gold truncate">
          SIMANTRI <span class="hidden sm:inline text-cream/60">&mdash; RUANG TUNGGU</span>
        </h1>
        <p class="mt-1 font-sans text-[8px] lg:text-[11px] xl:text-xs font-semibold uppercase tracking-[0.15em] text-cream/70 truncate">
          Kantor Kementerian Layanan Haji &amp; Umrah &middot; Kab. Jember
        </p>
      </div>
    </div>
    <div class="text-right shrink-0">
      <p id="tvJam" class="font-mono text-2xl md:text-3xl lg:text-4xl font-extrabold leading-none tracking-tight text-gold">00:00:00</p>
      <p id="tvTanggal" class="mt-1 font-sans text-[8px] lg:text-[10px] xl:text-xs font-bold uppercase tracking-[0.2em] text-cream/70"></p>
    </div>
  </header>

  <!-- MAIN KONTEN -->
  <main class="flex-1 flex flex-col min-h-0 gap-3 p-3 lg:gap-4 lg:p-4">
    
    <!-- BARIS TENGAH: Kiri (50%) Kanan (50%) -->
    <div class="flex-1 flex gap-3 lg:gap-4 min-h-0 w-full">
      
      <!-- ========================================== -->
      <!-- KOTAK KIRI (HIGHLIGHT PANGGILAN) -->
      <!-- ========================================== -->
      <div id="boxHighlight" class="w-[47%] flex flex-col items-center justify-center rounded-[2rem] border-2 border-gold/40 bg-bronze-raised p-4 lg:p-6 text-center shadow-2xl transition-all duration-500 overflow-hidden shrink-0">
        <p class="font-sans text-[10px] md:text-xs lg:text-sm font-bold uppercase tracking-[0.3em] text-cream/70 shrink-0">Panggilan Ke</p>
        <h2 id="highlightLoket" class="mt-2 font-sans text-2xl lg:text-4xl xl:text-[2.5rem] font-extrabold uppercase tracking-widest text-gold leading-tight shrink-0 w-full px-2 break-words whitespace-normal text-center">—</h2>
        
        <div class="my-4 lg:my-8 h-1 w-3/4 shrink-0 rounded-full bg-gradient-to-r from-transparent via-gold/50 to-transparent"></div>
        
        <p class="font-sans text-[9px] md:text-xs lg:text-sm font-semibold uppercase tracking-[0.4em] text-cream/60 shrink-0">Nomor Antrean</p>
        <p id="highlightNomor" class="mt-2 font-mono text-5xl md:text-6xl lg:text-7xl xl:text-[8rem] font-black leading-none tracking-tighter text-white drop-shadow-[0_0_20px_rgba(232,197,71,0.6)] shrink-0">---</p>
      </div>

      <!-- ========================================== -->
      <!-- KOTAK KANAN (VIDEO PLAYER) -->
      <!-- ========================================== -->
      <div class="w-[53%] h-full relative overflow-hidden rounded-[2rem] border-2 border-border/80 bg-black shadow-2xl shrink-0">
        <div id="ytplayer" class="absolute inset-0 h-full w-full pointer-events-none"></div>
        
        <div id="videoPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-black text-cream/30 z-10">
          <i data-lucide="video" class="h-10 w-10 mb-2 opacity-50 lg:h-14 lg:w-14"></i>
          <p class="font-sans text-[10px] lg:text-xs font-semibold tracking-widest uppercase">Video Belum Diatur</p>
        </div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- BARIS BAWAH: Grid 5 Loket (20vh) -->
    <!-- ========================================== -->
    <section aria-label="Nomor antrean per loket" class="shrink-0 grid h-[20vh] min-h-[8rem] grid-cols-5 gap-3 lg:gap-4">
      <!-- Kartu di-generate JS -->
    </section>
  </main>

  <template id="templateKartuLoket">
    <article class="flex h-full flex-col items-center justify-between rounded-xl lg:rounded-2xl border-2 border-border/60 bg-bronze-raised px-2 py-2 text-center shadow-lg transition-all duration-500 min-h-0">
      <header class="w-full border-b border-border/60 pb-1.5 shrink-0">
        <h2 class="nama-loket font-sans text-[9px] font-extrabold uppercase leading-tight tracking-[0.2em] text-cream lg:text-[13px] break-words whitespace-normal text-center"></h2>
      </header>
      
      <div class="container-isi flex flex-1 flex-col items-center justify-center gap-0.5 min-h-0">
        <p class="label-seri font-sans text-[8px] font-bold uppercase leading-none tracking-[0.3em] text-gold-deep lg:text-[10px]"></p>
        <p class="nomor-tampil font-mono text-2xl font-bold leading-none tracking-tight text-gold-deep lg:text-4xl"></p>
      </div>

      <div class="container-selesai hidden flex-1 flex-col items-center justify-center min-h-0">
        <div class="lingkaran-ikon rounded-full bg-green-500/20 p-2 opacity-0">
          <i data-lucide="check-circle-2" class="h-6 w-6 text-green-500 lg:h-10 lg:w-10"></i>
        </div>
      </div>

      <footer class="w-full border-t border-border/60 pt-1 shrink-0">
        <p class="label-status font-sans text-[8px] font-bold uppercase tracking-[0.25em] text-cream/45 lg:text-[9px]">TERSEDIA</p>
      </footer>
    </article>
  </template>

  <!-- TICKER PENGUMUMAN DI DASAR -->
  <footer class="shrink-0 relative z-50 flex items-center gap-3 bg-gold px-4 py-1.5 shadow-[0_-5px_15px_rgba(0,0,0,0.3)] md:px-6">
    <div class="flex items-center gap-2 shrink-0 rounded-lg bg-bronze-dark px-3 py-1 shadow-inner">
      <i data-lucide="megaphone" class="h-4 w-4 text-gold animate-pulse"></i>
      <p class="font-sans text-[9px] font-extrabold uppercase tracking-[0.2em] text-gold lg:text-[11px]">INFO</p>
    </div>
    <div class="relative flex-1 overflow-hidden">
      <div class="ticker-track" id="tickerTrack">
        <span class="shrink-0 pr-24 font-sans text-xs font-bold uppercase tracking-[0.1em] text-bronze-dark lg:text-sm" id="tickerTeks1">Memuat antrean…</span>
        <span class="shrink-0 pr-24 font-sans text-xs font-bold uppercase tracking-[0.1em] text-bronze-dark lg:text-sm" id="tickerTeks2" aria-hidden="true">Memuat antrean…</span>
      </div>
    </div>
  </footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7tHB3eRYd-0TGqLlxPsEanymb7qkmDYw",
  authDomain: "simantri-jember.firebaseapp.com",
  databaseURL: "https://simantri-jember-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "simantri-jember",
  storageBucket: "simantri-jember.firebasestorage.app",
  messagingSenderId: "507271630488",
  appId: "1:507271630488:web:dcc347a35334c6f3a84aed"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const KONFIGURASI_LOKET = [
  { id: 'loket1',    nama: 'Loket 1',         seri: 'A' },
  { id: 'loket2',    nama: 'Loket 2',         seri: 'B' },
  { id: 'loket3',    nama: 'Loket 3',         seri: 'A' },
  { id: 'loket4',    nama: 'Loket 4',         seri: 'B' },
  { id: 'biometrik', nama: 'Ruang Biometrik', seri: null },
];

const el = {
  grid: document.querySelector('section[aria-label="Nomor antrean per loket"]'),
  template: document.getElementById('templateKartuLoket'),
  overlay: document.getElementById('overlayAktifkan'),
  btnAktifkan: document.getElementById('btnAktifkan'),
  tvJam: document.getElementById('tvJam'),
  tvTanggal: document.getElementById('tvTanggal'),
  tickerTeks1: document.getElementById('tickerTeks1'),
  tickerTeks2: document.getElementById('tickerTeks2'),
  boxHighlight: document.getElementById('boxHighlight'),
  highlightLoket: document.getElementById('highlightLoket'),
  highlightNomor: document.getElementById('highlightNomor'),
  videoPlaceholder: document.getElementById('videoPlaceholder'),
};

const kartuLoket = {};
KONFIGURASI_LOKET.forEach(loket => {
  const node = el.template.content.cloneNode(true);
  const artikel = node.querySelector('article');
  artikel.dataset.loketId = loket.id;
  node.querySelector('.nama-loket').textContent = loket.nama;
  
  node.querySelector('.label-seri').textContent = loket.seri ? `Seri ${loket.seri}` : 'Rombongan';
  node.querySelector('.nomor-tampil').textContent = '---';
  node.querySelector('.nomor-tampil').classList.add('text-cream/20');
  
  el.grid.appendChild(node);
  
  const artikelReal = el.grid.querySelector(`[data-loket-id="${loket.id}"]`);
  kartuLoket[loket.id] = {
    artikel: artikelReal,
    containerIsi: artikelReal.querySelector('.container-isi'),
    containerSelesai: artikelReal.querySelector('.container-selesai'),
    ikonSelesai: artikelReal.querySelector('.lingkaran-ikon'),
    labelSeri: artikelReal.querySelector('.label-seri'),
    nomorTampil: artikelReal.querySelector('.nomor-tampil'),
    labelStatus: artikelReal.querySelector('.label-status'),
    seri: loket.seri,
    tutup: false,
    sedangDilayani: false
  };
});
lucide.createIcons();

function perbaruiJam(){
  const sekarang = new Date();
  el.tvJam.textContent = sekarang.toLocaleTimeString('id-ID', { hour12:false });
  el.tvTanggal.textContent = sekarang.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
perbaruiJam(); setInterval(perbaruiJam, 1000);

/* =========================================================================
   YOUTUBE IFRAME API (Bebas Error dan Anti Tabrakan)
   ========================================================================= */
let ytPlayer;
let isYtReady = false;
let pendingVideoId = null;

const VOLUME_NORMAL = 85; 
const VOLUME_MENGECIL = 10; 

// Menyuntikkan script YouTube API ke dalam HTML
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
const firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

// Fungsi pembaca kesiapan pemutar
window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('ytplayer', {
    height: '100%',
    width: '100%',
    playerVars: {
      'autoplay': 1,
      'controls': 0,
      'modestbranding': 1,
      'rel': 0,
      'mute': 1,
      'playsinline': 1
    },
    events: {
      'onReady': onPlayerReady,
      'onStateChange': onPlayerStateChange
    }
  });
};

function onPlayerReady(event) {
  isYtReady = true;
  if (pendingVideoId) {
    ytPlayer.loadVideoById(pendingVideoId);
  }
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.ENDED) {
    ytPlayer.playVideo(); 
  }
}

function redamSuaraVideo() {
  if (ytPlayer && isYtReady && typeof ytPlayer.setVolume === 'function') {
    ytPlayer.setVolume(VOLUME_MENGECIL);
  }
}

function pulihkanSuaraVideo() {
  if (ytPlayer && isYtReady && typeof ytPlayer.setVolume === 'function') {
    ytPlayer.setVolume(VOLUME_NORMAL);
  }
}

/* =========================================================================
   SISTEM SUARA & KLIK AKTIVASI
   ========================================================================= */
let suaraDiizinkan = false;
let konteksAudio = null;

function ambilKonteksAudio(){
  if (!konteksAudio) {
    const AC = window.AudioContext || window.webkitAudioContext;
    konteksAudio = new AC();
  }
  if (konteksAudio.state === 'suspended') {
    konteksAudio.resume();
  }
  return konteksAudio;
}

el.btnAktifkan.addEventListener('click', () => {
  suaraDiizinkan = true;
  
  // Menggunakan manipulasi class Tailwind yang aman
  el.overlay.classList.add('hidden');
  el.overlay.classList.remove('flex');
  
  ambilKonteksAudio();
  
  if (typeof responsiveVoice !== 'undefined') {
    responsiveVoice.speak("Sistem Antrean Layar TV Diaktifkan.", "Indonesian Female", { volume: 0 }); 
  }
  
  if (ytPlayer && isYtReady) {
    ytPlayer.unMute();
    ytPlayer.setVolume(VOLUME_NORMAL);
    ytPlayer.playVideo();
  }
});

function extractYouTubeID(url) {
  const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|live\/|shorts\/))([\w-]{11})/;
  const match = url.match(regExp);
  return match ? match[1] : false;
}

onValue(ref(db, 'pengaturan/video_url'), (snap) => {
  const urlMentah = snap.exists() ? snap.val() : '';
  const ytID = extractYouTubeID(urlMentah);
  
  if (ytID) {
    el.videoPlaceholder.style.display = 'none';
    document.getElementById('ytplayer').style.display = 'block';
    if (isYtReady) {
      ytPlayer.loadVideoById(ytID);
      if(suaraDiizinkan){
          setTimeout(() => { ytPlayer.unMute(); ytPlayer.setVolume(VOLUME_NORMAL); ytPlayer.playVideo(); }, 1000);
      }
    } else {
      pendingVideoId = ytID;
    }
  } else {
    document.getElementById('ytplayer').style.display = 'none';
    el.videoPlaceholder.style.display = 'flex';
    if (isYtReady) ytPlayer.stopVideo();
  }
});

/* =========================================================================
   SINKRONISASI STATUS GRID BAWAH
   ========================================================================= */
KONFIGURASI_LOKET.forEach(loket => {
  onValue(ref(db, `status_loket/${loket.id}`), (snap) => {
    const kartu = kartuLoket[loket.id];
    if (kartu.tutup) return; 

    if (!snap.exists()) {
      if(kartu.sedangDilayani) resetTampilanKosong(kartu); 
      return;
    }
    
    const data = snap.val();
    
    if (data.sedangDilayani === false) {
      if (kartu.sedangDilayani === true) jalankanAnimasiSelesai(kartu);
      else resetTampilanKosong(kartu);
      return;
    }

    if(data.sedangDilayani === true || data.sedangDilayani === undefined) {
      kartu.sedangDilayani = true;
      kartu.artikel.classList.remove('card-selesai');
      kartu.containerIsi.classList.remove('hidden');
      kartu.containerIsi.classList.add('flex');
      kartu.containerSelesai.classList.add('hidden');
      kartu.containerSelesai.classList.remove('flex');
      
      kartu.labelSeri.textContent = kartu.seri ? `Seri ${kartu.seri}` : 'Rombongan';
      kartu.nomorTampil.textContent = data.nomor;
      kartu.nomorTampil.classList.remove('text-cream/20');
      kartu.nomorTampil.style.transform = 'scale(1)'; 
      kartu.labelStatus.textContent = 'SEDANG DILAYANI';
      kartu.labelStatus.className = 'label-status font-sans text-[8px] font-bold uppercase tracking-[0.2em] text-cream/80 lg:text-[10px]';
    }
  });
});

function jalankanAnimasiSelesai(kartu) {
  kartu.sedangDilayani = false;
  kartu.containerIsi.classList.remove('flex');
  kartu.containerIsi.classList.add('hidden');
  kartu.containerSelesai.classList.remove('hidden');
  kartu.containerSelesai.classList.add('flex');
  
  kartu.ikonSelesai.classList.remove('animate-pop');
  void kartu.ikonSelesai.offsetWidth; 
  kartu.ikonSelesai.classList.add('animate-pop');
  
  kartu.labelStatus.textContent = 'SELESAI LAYANAN';
  kartu.labelStatus.className = 'label-status font-sans text-[8px] font-bold uppercase tracking-[0.2em] text-green-400 lg:text-[10px]';
  kartu.artikel.classList.add('card-selesai');
  
  setTimeout(() => { if(!kartu.sedangDilayani) resetTampilanKosong(kartu); }, 3500);
}

function resetTampilanKosong(kartu) {
  kartu.sedangDilayani = false;
  kartu.artikel.classList.remove('card-selesai');
  kartu.containerSelesai.classList.remove('flex');
  kartu.containerSelesai.classList.add('hidden');
  kartu.containerIsi.classList.remove('hidden');
  kartu.containerIsi.classList.add('flex');
  
  kartu.labelSeri.textContent = kartu.seri ? `Seri ${kartu.seri}` : 'Rombongan';
  kartu.nomorTampil.textContent = '---'; 
  kartu.nomorTampil.style.transform = 'scale(1)';
  kartu.nomorTampil.classList.add('text-cream/20');
  kartu.labelStatus.textContent = 'TERSEDIA';
  kartu.labelStatus.className = 'label-status font-sans text-[8px] font-bold uppercase tracking-[0.25em] text-cream/45 lg:text-[10px]';
}

/* =========================================================================
   ANIMASI PANGGILAN & SISTEM BEL
   ========================================================================= */
const PETA_NAMA_KE_ID = {
  'Loket 1': 'loket1', 'Loket 2': 'loket2', 'Loket 3': 'loket3', 'Loket 4': 'loket4',
  'Ruang Biometrik': 'biometrik',
};

let iniPembacaanPertama = true;
let idPanggilanTerakhir = null;

onValue(ref(db, 'panggilan_aktif'), (snapshot) => {
  if (!snapshot.exists()) return;
  const data = snapshot.val();

  const idPanggilan = `${data.nomor}-${data.timestamp}`;
  if (idPanggilan === idPanggilanTerakhir) return;
  idPanggilanTerakhir = idPanggilan;

  el.highlightLoket.textContent = data.loket.toUpperCase();
  el.highlightNomor.textContent = data.nomor;
  
  el.boxHighlight.classList.remove('card-active');
  void el.boxHighlight.offsetWidth;
  el.boxHighlight.classList.add('card-active');

  const loketId = PETA_NAMA_KE_ID[data.loket];
  if (loketId && kartuLoket[loketId] && !kartuLoket[loketId].tutup) {
    const artikel = kartuLoket[loketId].artikel;
    kartuLoket[loketId].sedangDilayani = true;
    artikel.classList.remove('card-selesai');
    
    artikel.classList.remove('card-active');
    void artikel.offsetWidth; 
    artikel.classList.add('card-active');
    
    setTimeout(() => {
      artikel.classList.remove('card-active');
      el.boxHighlight.classList.remove('card-active');
    }, 8000); 
  }

  if (iniPembacaanPertama) { iniPembacaanPertama = false; return; }
  if (suaraDiizinkan) mainkanPanggilan(data.nomor, data.loket);
});

onValue(ref(db, 'pengaturan/ticker/teks_berjalan'), (snap) => {
  const teks = snap.exists() && snap.val() ? snap.val() : 'Selamat datang di SIMANTRI — Sistem Manajemen Antrean.';
  el.tickerTeks1.textContent = teks; el.tickerTeks2.textContent = teks;
});

function terapkanStatusTutupLoket(loketId, aktif){
  const kartu = kartuLoket[loketId];
  if (!kartu) return;
  kartu.tutup = !aktif;

  if (aktif) {
    kartu.artikel.classList.remove('opacity-40');
    kartu.nomorTampil.classList.remove('text-cream/15');
    return;
  }

  kartu.artikel.classList.remove('card-active', 'card-selesai');
  kartu.artikel.classList.add('opacity-40');
  kartu.containerSelesai.classList.add('hidden');
  kartu.containerIsi.classList.remove('hidden');
  kartu.containerIsi.classList.add('flex');
  
  kartu.labelSeri.textContent = kartu.seri ? `Seri ${kartu.seri}` : '—';
  kartu.nomorTampil.textContent = '---';
  kartu.nomorTampil.style.transform = 'scale(1)';
  kartu.nomorTampil.classList.add('text-cream/15');
  kartu.labelStatus.textContent = 'TUTUP / OFFLINE';
  kartu.labelStatus.className = 'label-status font-sans text-[8px] font-bold uppercase tracking-[0.2em] text-red-400 lg:text-[10px]';
}

onValue(ref(db, 'pengaturan/loket_aktif'), (snap) => {
  const status = snap.exists() ? snap.val() : {};
  KONFIGURASI_LOKET.forEach(loket => {
    if (loket.id === 'biometrik') return; 
    const aktif = status[loket.id] !== undefined ? !!status[loket.id] : true;
    terapkanStatusTutupLoket(loket.id, aktif);
  });
});

function mainkanNada(frekuensi, waktuMulai, durasi, konteks){
  const osc = konteks.createOscillator();
  const gain = konteks.createGain();
  osc.type = 'sine'; osc.frequency.value = frekuensi;
  osc.connect(gain); gain.connect(konteks.destination);
  gain.gain.setValueAtTime(0, waktuMulai);
  gain.gain.linearRampToValueAtTime(0.35, waktuMulai + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, waktuMulai + durasi);
  osc.start(waktuMulai); osc.stop(waktuMulai + durasi);
}

function mainkanBel(){
  try {
    const konteks = ambilKonteksAudio();
    const sekarang = konteks.currentTime;
    mainkanNada(880, sekarang, 0.35, konteks);
    mainkanNada(659, sekarang + 0.32, 0.45, konteks);
  } catch (e) { console.warn('Audio bel gagal dimainkan:', e); }
}

const PETA_ANGKA = { '0':'kosong','1':'satu','2':'dua','3':'tiga','4':'empat','5':'lima','6':'enam','7':'tujuh','8':'delapan','9':'sembilan' };
function ejaNomorAntrean(nomor){
  const bagian = String(nomor).split('-');
  const prefixHuruf = bagian[0] || '';
  const digitStr = bagian[1] || '';
  const digitDieja = digitStr.split('').map(d => PETA_ANGKA[d] || d).join(', ');
  return `${prefixHuruf}, ${digitDieja}`;
}

function mainkanPanggilan(nomor, namaLoket){
  redamSuaraVideo();
  mainkanBel();
  const teks = `Nomor Antrean. ${ejaNomorAntrean(nomor)}. Silakan menuju. ${namaLoket}.`;
  
  setTimeout(() => {
    if (typeof responsiveVoice !== 'undefined') {
      responsiveVoice.speak(teks, "Indonesian Female", { 
        pitch: 1.05, 
        rate: 1.0, 
        volume: 1.0,
        onend: pulihkanSuaraVideo 
      });
    } else {
      setTimeout(pulihkanSuaraVideo, 4000);
    }
  }, 1000); 
}
